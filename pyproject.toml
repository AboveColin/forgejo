[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgejo"
version = "1.0.0"
description = "Async client library for the Forgejo and Gitea REST API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "AboveColin", email = "colin@cdevries.dev" }]
keywords = ["forgejo", "gitea", "git", "forge", "async", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9", "yarl>=1.9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/AboveColin/forgejo"
Issues = "https://github.com/AboveColin/forgejo/issues"

[tool.setuptools.packages.find]
include = ["forgejo*"]

[tool.setuptools.package-data]
forgejo = ["py.typed"]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint."messages control"]
disable = ["too-many-instance-attributes", "too-many-arguments", "too-few-public-methods"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
